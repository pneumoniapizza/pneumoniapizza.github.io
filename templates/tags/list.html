{% extends "base.html" %}
{% block content %}
  <h1>Tags</h1>
  <div class="terms-list">
    <ul>
      {%- for term in terms %}
      <li><a href="{{ term.permalink }}">#{{ term.name }}</a> ({{ term.pages | length }})</li>
      {%- endfor %}
    </ul>
  </div>
  <div class="terminal-nav"><div class="back-nav"><a href="{{ get_url(path="/") }}" class="back-link">../</a></div></div>
{% endblock content %}
